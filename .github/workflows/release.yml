name: installer

# Builds OffSpeak-Setup-<version>.exe. On a published release it is attached to the release;
# started by hand or by a push to an installer* branch, it is kept as a workflow artifact for testing.
on:
  release:
    types: [published]
  push:
    branches: ["installer*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.12.24"
  UV_SHA256: "7c38608c8a18ee137d748a1773053b07ec8f3a30fab49aebaa6f4e4efeceb019"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") }
               else { (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value + "-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Download uv ${{ env.UV_VERSION }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile uv.zip
          if ((Get-FileHash uv.zip -Algorithm SHA256).Hash.ToLower() -ne $env:UV_SHA256) { throw "uv.zip checksum mismatch" }
          Expand-Archive uv.zip -DestinationPath build\uv
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\offspeak.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/OffSpeak-Setup-${{ steps.version.outputs.value }}.exe" --clobber
      - name: Keep as artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: OffSpeak-Setup
          path: dist/*.exe

  # opens a pull request on microsoft/winget-pkgs for the new version; needs the WINGET_TOKEN secret
  # (a classic token with public_repo) and the package already in winget-pkgs
  winget:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit to winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { "no WINGET_TOKEN secret, skipped"; exit 0 }
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Applirado.OffSpeak --version $v `
            --urls "https://github.com/applirado/offspeak/releases/download/v$v/OffSpeak-Setup-$v.exe" `
            --release-notes-url "https://github.com/applirado/offspeak/releases/tag/v$v" `
            --release-date (Get-Date -Format yyyy-MM-dd) --token $env:WINGET_TOKEN --submit --no-open
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed" }

  # install on a clean Windows, dictate a spoken sentence with the installed app, uninstall
  test:
    if: github.event_name != 'release'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OffSpeak-Setup
      - name: Install silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem OffSpeak-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=autostart", "/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "setup exited with $($p.ExitCode)" }
      - name: Check the installation
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\OffSpeak"
          foreach ($f in ".venv\OffSpeak\OffSpeak.exe", "bin\uv.exe", "unins000.exe", "offspeak.ico") {
            if (-not (Test-Path "$app\$f")) { throw "missing $f" }
          }
          if (-not (Get-ChildItem "$app\python" -Directory)) { throw "Python is not inside the install folder" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Offspeak
          if ($run -notlike "*$app*OffSpeak.exe*") { throw "autostart entry: $run" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\OffSpeak.lnk")) { throw "no Start menu entry" }
          if ((Get-Item "$app\.venv\OffSpeak\OffSpeak.exe").VersionInfo.FileDescription -ne "OffSpeak") { throw "OffSpeak.exe has no version info" }
          & "$app\.venv\Scripts\offspeak.exe" models
      - name: Transcribe a spoken sentence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          if (-not $s.GetInstalledVoices().Count) { "no TTS voice on this runner, skipped"; exit 0 }
          $s.SetOutputToWaveFile("$PWD\hello.wav"); $s.Speak("Hello, this is a quick test of the dictation app."); $s.Dispose()
          $text = & "$env:LOCALAPPDATA\Programs\OffSpeak\.venv\Scripts\offspeak.exe" transcribe hello.wav
          "transcript: $text"
          if ($text -notmatch "quick test") { throw "unexpected transcript" }
      - name: Uninstall silently and check that nothing is left
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\OffSpeak"
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep 2 }  # the uninstaller runs from a temp copy
          if (Test-Path $app) { Get-ChildItem $app -Recurse | Select-Object -First 20 FullName; throw "install folder left behind" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Offspeak) { throw "autostart entry left behind" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\OffSpeak.lnk") { throw "Start menu entry left behind" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Offspeak\models")) { throw "a silent uninstall must keep the user's data" }
