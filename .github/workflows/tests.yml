name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install packages
        run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen pytest -q
      - name: Native libraries load
        run: uv run --frozen python -c "import onnxruntime, onnx_asr, pywhispercpp.model, llama_cpp, sounddevice, soundfile; print('ok')"

  # end-to-end on macOS: speak a sentence with `say`, transcribe it with Parakeet
  macos-transcribe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install packages
        run: uv sync --frozen --no-dev
      - uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Offspeak/models
          key: parakeet-tdt-0.6b-v3
      - name: Download Parakeet
        run: |
          uv run --frozen python -c "import sys; from offspeak import models; from offspeak.config import Config; sys.exit(0 if 'parakeet-tdt-0.6b-v3' in models.voice_models(Config().settings.model_dirs()) else 1)" \
            || uv run --frozen offspeak download-model parakeet-tdt-0.6b-v3
      - name: Transcribe a spoken sentence
        run: |
          say -o hello.aiff "Hello, this is a quick test of the dictation app."
          uv run --frozen offspeak transcribe hello.aiff --json | tee result.json
          grep -qi "quick test" result.json
      - name: Install with install.sh
        run: |
          git archive --format=tar.gz --prefix=offspeak-test/ -o "$RUNNER_TEMP/offspeak.tar.gz" HEAD
          OFFSPEAK_SOURCE_TAR="$RUNNER_TEMP/offspeak.tar.gz" bash install.sh
      - name: Check OffSpeak.app
        run: |
          app="$HOME/Applications/OffSpeak.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.applirado.offspeak
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = true
          file "$app/Contents/MacOS/applet" | grep -q Mach-O  # a real program, so macOS asks in OffSpeak's name
          codesign --verify "$app"
          test -s "$app/Contents/Resources/applet.icns"
          test -x ~/Library/Application\ Support/Offspeak/app/.venv/bin/python
          plutil -p ~/Library/LaunchAgents/com.applirado.offspeak.plist | grep -q "OffSpeak.app"
      - name: The menu bar app starts as a child of OffSpeak.app and keeps running
        run: |
          # install.sh opened the app; without Accessibility it waits for permission, but must not crash
          sleep 20
          data=~/Library/Application\ Support/Offspeak
          pid="$(pgrep -f "offspeak run" | head -1)"
          if [ -z "$pid" ] || grep -q Traceback "$data/launcher.log" "$data/offspeak.log"; then
            tail -n 60 "$data/launcher.log" "$data/offspeak.log"; exit 1
          fi
          while [ "$pid" -gt 1 ]; do  # walk up the parents to OffSpeak.app's program
            ps -o comm= -p "$pid" | grep -q "OffSpeak.app/Contents/MacOS/applet" && exit 0
            pid="$(ps -o ppid= -p "$pid" | tr -d ' ')"
          done
          echo "Python does not run under OffSpeak.app"; exit 1
      - name: The settings window opens in a process of its own
        run: |
          cd ~/Library/Application\ Support/Offspeak/app
          .venv/bin/python -m offspeak settings > settings.out 2>&1 &
          sleep 8
          kill -0 $! || { cat settings.out; exit 1; }
          kill $!
