[project]
name = "localwhisper"
version = "0.1.0"
description = "Offline voice dictation for Windows: whisper.cpp speech-to-text plus optional llama.cpp clean-up, no cloud."
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-cpp-python>=0.3.16",
    "numpy>=2.0",
    "onnx-asr[cpu,hub]>=0.12",
    "pillow>=10.0",
    "pynput>=1.8",
    "pystray>=0.19.5",
    "pywhispercpp>=1.3.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "uiautomation>=2.0.20",
]

[project.scripts]
localwhisper = "localwhisper.cli:main"

[project.gui-scripts]
localwhisperw = "localwhisper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localwhisper"]

[tool.uv]
no-build-package = ["llama-cpp-python"]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
