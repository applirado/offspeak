[project]
name = "offspeak"
version = "0.1.0"
description = "Offline voice dictation for Windows: local speech-to-text (Parakeet or whisper.cpp) with optional llama.cpp clean-up, no cloud."
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-cpp-python>=0.3.16; sys_platform != 'darwin'",
    # newer macOS wheels (0.3.31-0.3.36) are published as corrupt zip files
    "llama-cpp-python==0.3.30; sys_platform == 'darwin'",
    "numpy>=2.0",
    "onnx-asr[cpu,hub]>=0.12",
    "pillow>=10.0",
    "pynput>=1.8",
    "pystray>=0.19.5",
    "pywhispercpp>=1.3.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "uiautomation>=2.0.20",
]

[project.scripts]
offspeak = "offspeak.cli:main"

[project.gui-scripts]
offspeakw = "offspeak.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offspeak"]

[tool.uv]
no-build-package = ["llama-cpp-python"]

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-cpp-cpu", marker = "sys_platform != 'darwin'" },
    { index = "llama-cpp-metal", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
